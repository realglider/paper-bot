name: paper-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: python3 -m unittest -q tests.test_model

      - name: Messen und Scheintrades loggen
        run: python3 bot/paper_bot.py --samples 4 --interval 60

      - name: Ergebnisse speichern
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
