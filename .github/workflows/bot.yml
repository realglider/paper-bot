name: paper-bot

on:
  schedule:
    - cron: "7,37 * * * *"   # nur Sicherheitsnetz, falls die Kette reisst
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: python3 -m unittest -q tests.test_futures

      - name: KuCoin-Futures-Scheinkonto
        run: python3 kucoin/futures_bot.py

      - name: Ergebnisse speichern
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data docs/futures.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1

      # Rund fuenf Minuten Abstand zwischen den Laeufen.
      - name: Pause
        if: ${{ !cancelled() }}
        run: sleep 240

      # GitHubs Zeitplan startet oft stark verspaetet oder gar nicht. Deshalb stoesst
      # jeder Lauf den naechsten selbst an. Stoppen: laufenden Lauf abbrechen (Cancel).
      - name: Naechsten Lauf starten
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo "$GITHUB_REPOSITORY" --ref main
